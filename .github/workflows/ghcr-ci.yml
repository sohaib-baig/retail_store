name: Build & Push Docker Compose Images to GHCR

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Docker Compose Images
        run: docker compose build

      - name: Tag and Push Built Services to GHCR
        run: |
          PREFIX=ghcr.io/${{ secrets.GHCR_USERNAME }}

          for SERVICE in catalog cart checkout orders ui; do
            echo "Processing $SERVICE"

            IMAGE_ID=$(docker compose images -q $SERVICE)
            IMAGE_NAME="$PREFIX/$SERVICE"

            docker tag $IMAGE_ID $IMAGE_NAME:latest
            docker tag $IMAGE_ID $IMAGE_NAME:${{ github.sha }}

            docker push $IMAGE_NAME:latest
            docker push $IMAGE_NAME:${{ github.sha }}
          done

