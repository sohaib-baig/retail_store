name: Build & Push Docker Compose Images to GHCR

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yq
        run: sudo apt-get install -y yq

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Docker Compose Images
        run: docker compose build

      - name: Extract all build services and push them
        run: |
          PREFIX=ghcr.io/${{ secrets.GHCR_USERNAME }}

          # List only services that have a build context
          SERVICES=$(yq '.services | to_entries | map(select(.value.build)) | .[].key' docker-compose.yml)

          echo "Services to push:"
          echo "$SERVICES"

          for SERVICE in $SERVICES; do
            IMAGE_NAME=$(yq ".services.$SERVICE.image" docker-compose.yml)

            echo "Processing $SERVICE → $IMAGE_NAME"

            # Get built image ID
            IMAGE_ID=$(docker images --filter "reference=${IMAGE_NAME}" --format "{{.ID}}" | head -n 1)

            echo "Image ID = $IMAGE_ID"

            if [ -z "$IMAGE_ID" ]; then
              echo "ERROR: No image found for $SERVICE"
              exit 1
            fi

            docker tag $IMAGE_ID $IMAGE_NAME:latest
            docker tag $IMAGE_ID $IMAGE_NAME:${{ github.sha }}

            docker push $IMAGE_NAME:latest
            docker push $IMAGE_NAME:${{ github.sha }}
          done

